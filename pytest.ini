[pytest]
# Pytest configuration for PlotlyVizPro

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 6.0

# Output options
addopts =
    -v
    --strict-markers
    --disable-warnings
    --color=yes
    --tb=short

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    notebook: marks tests that execute notebooks

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=utils --cov=pages --cov-report=html --cov-report=term

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    env
    .venv
    __pycache__
    .ipynb_checkpoints
    exports
    datasets
