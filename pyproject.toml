[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotlyvizpro"
dynamic = ["version"]
description = "Research-grade toolkit for interactive, publication-ready Plotly figures: statistical overlays, CVD-safe palettes, downsampling, and reproducible exports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Satvik Praveen"}]
keywords = ["plotly", "visualization", "data-science", "statistics", "reproducibility", "accessibility", "streamlit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "plotly>=5.18",
]

[project.optional-dependencies]
export = ["kaleido>=0.2"]
app = ["streamlit>=1.30"]
data = ["faker>=18"]
notebooks = ["jupyterlab>=4", "nbformat>=5.9", "nbconvert>=7.7", "ipykernel"]
ml = ["scikit-learn>=1.3", "statsmodels>=0.14"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit>=3.5",
    "statsmodels>=0.14",
    "kaleido>=0.2",
    "faker>=18",
    "streamlit>=1.30",
    "nbformat>=5.9",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
all = ["plotlyvizpro[export,app,data,notebooks,ml]"]

[project.scripts]
plotlyvizpro = "plotlyvizpro.cli:main"

[project.urls]
Homepage = "https://github.com/SatvikPraveen/PlotlyVizPro"
Documentation = "https://satvikpraveen.github.io/PlotlyVizPro/"
Repository = "https://github.com/SatvikPraveen/PlotlyVizPro"
Issues = "https://github.com/SatvikPraveen/PlotlyVizPro/issues"
Changelog = "https://github.com/SatvikPraveen/PlotlyVizPro/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
packages = ["plotlyvizpro", "plotlyvizpro.stats"]

[tool.setuptools.dynamic]
version = {attr = "plotlyvizpro._version.__version__"}

[tool.setuptools.package-data]
plotlyvizpro = ["py.typed"]

# ------------------------------------------------------------------------------
# Ruff: linting + formatting (replaces black, isort, flake8)
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "exports", "datasets", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "D",        # pydocstyle
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "NPY",      # numpy
    "PD",       # pandas-vet
    "PT",       # pytest style
]
ignore = [
    "D100", "D104", "D105", "D107",   # module/package/magic/init docstrings
    "D203", "D213",                   # conflicting pydocstyle conventions
    "N803", "N806",                   # allow L / C / X style math names
    "RUF001", "RUF002", "RUF003",     # allow unicode in docstrings/comments
    "E741",                           # ambiguous variable name `l` (margins)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N", "PD", "B011", "RUF012"]
"benchmarks/**" = ["D"]
"pages/**" = ["D", "E402", "N999"]
"examples/**" = ["D", "E402"]
"app.py" = ["D"]
"generate_datasets.py" = ["D"]
"utils/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ------------------------------------------------------------------------------
# mypy
# ------------------------------------------------------------------------------
[tool.mypy]
packages = ["plotlyvizpro"]
strict = true
warn_unreachable = true
ignore_missing_imports = true
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["plotly.*", "scipy.*", "kaleido.*", "faker.*", "streamlit.*", "statsmodels.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# pytest / coverage
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short", "-p", "no:cacheprovider"]
filterwarnings = [
    "error::DeprecationWarning:plotlyvizpro",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "kaleido: requires a static-image engine",
    "statsmodels: requires statsmodels for cross-validation",
    "notebook: executes notebooks end-to-end",
]

[tool.coverage.run]
source = ["plotlyvizpro"]
branch = true
omit = ["plotlyvizpro/cli.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
