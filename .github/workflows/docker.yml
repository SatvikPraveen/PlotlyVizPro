name: Docker

on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "plotlyvizpro/**"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "plotlyvizpro/**"]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: plotlyvizpro:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm plotlyvizpro:test plotlyvizpro info
          docker run --rm plotlyvizpro:test plotlyvizpro audit-palette pvp_light
